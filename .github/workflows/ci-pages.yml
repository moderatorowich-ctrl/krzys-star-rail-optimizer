name: Verify and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install web dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Install scanner test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install -r apps/scanner/requirements.txt
      - name: Verify source and data
        env:
          REQUIRE_OCR: '1'
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test
          npm run scanner:test
      - name: Verify production application
        run: |
          npm run build
          npm run test:pages
          npm run links:check
          npm run test:e2e
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: vars.ENABLE_PRIVATE_PAGES == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
